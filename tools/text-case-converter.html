
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Convert text to uppercase, lowercase, title case and sentence case with Knowly's free text case converter.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Free Text Case Converter | KNOWLY</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#f1f5f9;font-family:Arial,sans-serif}
header{padding:22px 8%;border-bottom:1px solid #263449}
header a,.back{color:#38bdf8;text-decoration:none}
header a{font-size:25px;font-weight:bold}
main{max-width:750px;margin:60px auto;padding:25px}
.card{background:#172337;padding:30px;border-radius:16px;border:1px solid #304158}
h1{font-size:32px}
p{color:#bdc9d8;line-height:1.6}
textarea{width:100%;min-height:200px;padding:15px;border-radius:8px;border:1px solid #52647a;background:#0b1220;color:white;font-size:16px;resize:vertical}
textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #38bdf8;outline-offset:3px}
.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
button{padding:13px;background:#0284c7;color:white;border:0;border-radius:8px;font-size:14px;cursor:pointer}
button:hover{background:#0369a1}
#message{color:#38bdf8;margin-top:15px;min-height:20px}
footer{text-align:center;padding:25px;color:#94a3b8}
@media(min-width:600px){.buttons{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><a href="../index.html">KNOWLY</a></header>

<main>
<a class="back" href="../index.html">← Back to Home</a>
<h1>Free Text Case Converter</h1>
<p>Convert your text into different letter cases instantly. Your text is processed locally in your browser.</p>

<div class="card">
<textarea id="text" maxlength="100000" autocomplete="off"
aria-label="Text to convert"
placeholder="Type or paste your text here..."></textarea>

<div class="buttons">
<button type="button" data-action="upper">UPPERCASE</button>
<button type="button" data-action="lower">lowercase</button>
<button type="button" data-action="title">Title Case</button>
<button type="button" data-action="sentence">Sentence case</button>
<button type="button" data-action="alternating">aLtErNaTiNg</button>
<button type="button" id="copyButton">Copy Text</button>
</div>

<p id="message" role="status" aria-live="polite"></p>
</div>
</main>

<footer>© 2026 KNOWLY. Discover More. Do More. Know More.</footer>

<script>
"use strict";

const textArea = document.getElementById("text");
const message = document.getElementById("message");

function convert(type) {
  let text = textArea.value;

  if (type === "upper") {
    text = text.toUpperCase();
  } else if (type === "lower") {
    text = text.toLowerCase();
  } else if (type === "title") {
    text = text.toLowerCase().replace(
      /\b\p{L}/gu,
      char => char.toUpperCase()
    );
  } else if (type === "sentence") {
    text = text.toLowerCase().replace(
      /(^\s*|[.!?]\s+)(\p{L})/gu,
      (match, prefix, char) => prefix + char.toUpperCase()
    );
  } else if (type === "alternating") {
    let index = 0;
    text = Array.from(text).map(char => {
      if (/\p{L}/u.test(char)) {
        const result = index % 2 === 0
          ? char.toLowerCase()
          : char.toUpperCase();
        index++;
        return result;
      }
      return char;
    }).join("");
  }

  textArea.value = text;
  message.textContent = "Text converted successfully!";
}

document.querySelectorAll("[data-action]").forEach(button => {
  button.addEventListener("click", () => {
    convert(button.dataset.action);
  });
});

document.getElementById("copyButton").addEventListener("click", async () => {
  if (!textArea.value) {
    message.textContent = "Please enter some text first.";
    return;
  }

  try {
    if (!navigator.clipboard || !window.isSecureContext) {
      throw new Error("Clipboard unavailable");
    }

    await navigator.clipboard.writeText(textArea.value);
    message.textContent = "Text copied to clipboard!";
  } catch (error) {
    textArea.focus();
    textArea.select();
    message.textContent = "Copy unavailable. Select and copy the text manually.";
  }
});
</script>
</body>
</html>
