
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Estimate how long it takes to read any text with Knowly's free reading time calculator.">
<meta name="theme-color" content="#0b1220">
<title>Free Reading Time Calculator | KNOWLY</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#0b1220;
 color:#f1f5f9;
 font-family:Arial,sans-serif;
}

header{
 padding:22px 8%;
 border-bottom:1px solid #263449;
}

header a,.back{
 color:#38bdf8;
 text-decoration:none;
}

header a{
 font-size:25px;
 font-weight:bold;
}

main{
 max-width:750px;
 margin:60px auto;
 padding:25px;
}

.card{
 background:#172337;
 padding:30px;
 border-radius:16px;
 border:1px solid #304158;
}

h1{font-size:32px}

p{
 color:#bdc9d8;
 line-height:1.6;
}

label{
 display:block;
 margin:20px 0 8px;
 font-weight:bold;
}

textarea,input{
 width:100%;
 padding:14px;
 border-radius:8px;
 border:1px solid #52647a;
 background:#0b1220;
 color:white;
 font-size:16px;
 font-family:inherit;
}

textarea{
 min-height:220px;
 resize:vertical;
 line-height:1.6;
}

textarea:focus,input:focus{
 outline:2px solid #38bdf8;
 outline-offset:2px;
 border-color:#38bdf8;
}

input{
 font-size:17px;
}

.result{
 margin-top:22px;
 padding:22px;
 background:#0b3045;
 border-radius:8px;
 text-align:center;
}

.result strong{
 display:block;
 font-size:30px;
 color:#38bdf8;
 margin:10px;
}

.result span{
 color:#bdc9d8;
}

.note{
 margin-top:12px;
 color:#94a3b8;
 font-size:13px;
}

footer{
 text-align:center;
 padding:25px;
 color:#94a3b8;
}

@media(max-width:480px){
 main{margin:30px auto;padding:18px}
 .card{padding:20px}
 h1{font-size:27px}
 .result strong{font-size:25px}
}
</style>
</head>

<body>

<header>
 <a href="../index.html">KNOWLY</a>
</header>

<main>
 <a class="back" href="../index.html">← Back to Home</a>

 <h1>Free Reading Time Calculator</h1>
 <p>Find out how long it takes to read your text based on your reading speed.</p>

 <div class="card">

  <label for="text">Paste or type your text</label>

  <textarea
   id="text"
   maxlength="100000"
   placeholder="Enter your text here..."
   aria-label="Enter text to calculate reading time"
   autocomplete="off"
  ></textarea>

  <div class="note">Maximum 100,000 characters.</div>

  <label for="speed">Reading speed (words per minute)</label>

  <input
   type="number"
   id="speed"
   min="1"
   max="2000"
   step="1"
   value="200"
   inputmode="numeric"
   aria-label="Reading speed in words per minute"
  >

  <div class="result" role="status" aria-live="polite" aria-atomic="true">
   Estimated Reading Time
   <strong id="time">0 seconds</strong>
   <span id="wordCount">0 words</span>
  </div>

 </div>
</main>

<footer>
 © 2026 KNOWLY. Discover More. Do More. Know More.
</footer>

<script>
"use strict";

const textInput = document.getElementById("text");
const speedInput = document.getElementById("speed");
const timeOutput = document.getElementById("time");
const wordCountOutput = document.getElementById("wordCount");

function calculateReadingTime(){

 const text = textInput.value.trim();

 const words = text
  ? (text.match(/\S+/gu) || []).length
  : 0;

 wordCountOutput.textContent =
  words.toLocaleString() + (words === 1 ? " word" : " words");

 const speedValue = speedInput.value.trim();
 const speed = Number(speedValue);

 if(
  speedValue === "" ||
  !Number.isFinite(speed) ||
  !Number.isInteger(speed) ||
  speed < 1 ||
  speed > 2000
 ){
  timeOutput.textContent = "Enter a speed from 1 to 2000";
  return;
 }

 if(words === 0){
  timeOutput.textContent = "0 seconds";
  return;
 }

 const totalSeconds = Math.ceil((words / speed) * 60);

 if(totalSeconds < 60){
  timeOutput.textContent =
   totalSeconds + (totalSeconds === 1 ? " second" : " seconds");
  return;
 }

 const minutes = Math.floor(totalSeconds / 60);
 const seconds = totalSeconds % 60;

 let display = minutes + (minutes === 1 ? " minute" : " minutes");

 if(seconds > 0){
  display += " " + seconds + (seconds === 1 ? " second" : " seconds");
 }

 timeOutput.textContent = display;
}

textInput.addEventListener("input", calculateReadingTime);
speedInput.addEventListener("input", calculateReadingTime);

calculateReadingTime();
</script>

</body>
</html>
