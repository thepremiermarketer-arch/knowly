
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Calculate percentages quickly and easily with Knowly's free online percentage calculator.">
<meta name="theme-color" content="#0b1220">
<title>Free Percentage Calculator | KNOWLY</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#0b1220;
 color:#f1f5f9;
 min-height:100vh;
}

header{
 padding:22px 8%;
 border-bottom:1px solid #263449;
}

header a,.back{
 color:#38bdf8;
 text-decoration:none;
}

header a{
 font-size:25px;
 font-weight:bold;
}

main{
 max-width:700px;
 margin:60px auto;
 padding:25px;
}

.card{
 background:#172337;
 padding:30px;
 border-radius:16px;
 border:1px solid #304158;
}

h1{font-size:32px}

p{
 color:#bdc9d8;
 line-height:1.6;
}

label{
 display:block;
 margin:18px 0 8px;
 font-weight:bold;
}

input{
 width:100%;
 padding:14px;
 border-radius:8px;
 border:1px solid #52647a;
 background:#0b1220;
 color:white;
 font-size:17px;
}

input:focus{
 outline:2px solid #38bdf8;
 outline-offset:2px;
 border-color:#38bdf8;
}

button{
 margin-top:22px;
 width:100%;
 padding:15px;
 border:0;
 border-radius:8px;
 background:#0284c7;
 color:white;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
}

button:hover{background:#0369a1}

button:focus-visible{
 outline:2px solid #38bdf8;
 outline-offset:3px;
}

#result{
 margin-top:22px;
 padding:18px;
 background:#0b3045;
 border-radius:8px;
 font-size:20px;
 text-align:center;
 overflow-wrap:anywhere;
 line-height:1.6;
}

footer{
 text-align:center;
 padding:25px;
 color:#94a3b8;
}

@media(max-width:480px){
 main{margin:30px auto;padding:18px}
 .card{padding:20px}
 h1{font-size:27px}
}
</style>
</head>

<body>

<header>
 <a href="../index.html">KNOWLY</a>
</header>

<main>
 <a class="back" href="../index.html">← Back to Home</a>

 <h1>Free Percentage Calculator</h1>

 <p>
 Calculate percentages quickly and easily.
 Enter a number and a percentage to find the result.
 </p>

 <div class="card">

  <form id="calculatorForm" novalidate>

   <label for="number">Enter your number</label>
   <input
    type="number"
    id="number"
    placeholder="e.g. 200"
    step="any"
    maxlength="50"
    aria-label="Enter the number"
   >

   <label for="percentage">Enter percentage (%)</label>
   <input
    type="number"
    id="percentage"
    placeholder="e.g. 15"
    step="any"
    aria-label="Enter the percentage"
   >

   <button type="submit">Calculate Percentage</button>

  </form>

  <div id="result" role="status" aria-live="polite" aria-atomic="true">
   Your result will appear here.
  </div>

 </div>
</main>

<footer>
 © 2026 KNOWLY. Discover More. Do More. Know More.
</footer>

<script>
"use strict";

const form = document.getElementById("calculatorForm");
const numberInput = document.getElementById("number");
const percentageInput = document.getElementById("percentage");
const result = document.getElementById("result");

function calculate(event){

 if(event){
  event.preventDefault();
 }

 const numberText = numberInput.value.trim();
 const percentageText = percentageInput.value.trim();

 if(numberText === "" || percentageText === ""){
  result.textContent = "Please enter both numbers.";
  return;
 }

 if(numberText.length > 50 || percentageText.length > 50){
  result.textContent = "Please enter shorter numbers.";
  return;
 }

 const value = Number(numberText);
 const rate = Number(percentageText);

 if(!Number.isFinite(value) || !Number.isFinite(rate)){
  result.textContent = "Please enter valid numbers.";
  return;
 }

 const answer = (value * rate) / 100;

 if(!Number.isFinite(answer)){
  result.textContent = "The result is too large to calculate.";
  return;
 }

 const formattedAnswer = Number(answer.toPrecision(12));

 const formattedValue = Number(value.toPrecision(12));
 const formattedRate = Number(rate.toPrecision(12));

 result.textContent =
  formattedRate + "% of " + formattedValue + " = " + formattedAnswer;
}

form.addEventListener("submit", calculate);
</script>

</body>
</html>
