
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Calculate sale prices and savings with Knowly's free discount calculator.">
<meta name="theme-color" content="#0b1220">
<title>Free Discount Calculator | KNOWLY</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#0b1220;
 color:#f1f5f9;
 font-family:Arial,sans-serif;
 min-height:100vh;
}

header{
 padding:22px 8%;
 border-bottom:1px solid #263449;
}

header a,.back{
 color:#38bdf8;
 text-decoration:none;
}

header a{
 font-size:25px;
 font-weight:bold;
}

main{
 max-width:700px;
 margin:60px auto;
 padding:25px;
}

.card{
 background:#172337;
 padding:30px;
 border-radius:16px;
 border:1px solid #304158;
}

h1{font-size:32px}

p{
 color:#bdc9d8;
 line-height:1.6;
}

label{
 display:block;
 margin:20px 0 8px;
 font-weight:bold;
}

input{
 width:100%;
 padding:14px;
 border-radius:8px;
 border:1px solid #52647a;
 background:#0b1220;
 color:white;
 font-size:17px;
}

input:focus{
 outline:2px solid #38bdf8;
 outline-offset:2px;
 border-color:#38bdf8;
}

button{
 margin-top:22px;
 width:100%;
 padding:15px;
 background:#0284c7;
 color:white;
 border:0;
 border-radius:8px;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
}

button:hover{background:#0369a1}

button:focus-visible{
 outline:2px solid #38bdf8;
 outline-offset:3px;
}

#result{
 margin-top:22px;
 padding:20px;
 background:#0b3045;
 border-radius:8px;
 line-height:1.8;
 overflow-wrap:anywhere;
}

#result strong{
 color:#38bdf8;
}

.result-row{
 margin:6px 0;
}

footer{
 text-align:center;
 padding:25px;
 color:#94a3b8;
}

@media(max-width:480px){
 main{margin:30px auto;padding:18px}
 .card{padding:20px}
 h1{font-size:27px}
}
</style>
</head>

<body>

<header>
 <a href="../index.html">KNOWLY</a>
</header>

<main>

<a class="back" href="../index.html">← Back to Home</a>

<h1>Free Discount Calculator</h1>

<p>
 Calculate the final price after a discount and see how much money you save.
</p>

<div class="card">

 <form id="discountForm" novalidate>

  <label for="price">Original Price</label>

  <input
   type="number"
   id="price"
   min="0"
   step="any"
   placeholder="e.g. 100"
   aria-label="Original price"
  >

  <label for="discount">Discount Percentage (%)</label>

  <input
   type="number"
   id="discount"
   min="0"
   max="100"
   step="any"
   placeholder="e.g. 20"
   aria-label="Discount percentage"
  >

  <button type="submit">Calculate Discount</button>

 </form>

 <div id="result" role="status" aria-live="polite" aria-atomic="true">
  Your result will appear here.
 </div>

</div>

</main>

<footer>
 © 2026 KNOWLY. Discover More. Do More. Know More.
</footer>

<script>
"use strict";

const form = document.getElementById("discountForm");
const priceInput = document.getElementById("price");
const discountInput = document.getElementById("discount");
const result = document.getElementById("result");

function calculateDiscount(event){

 event.preventDefault();

 const priceText = priceInput.value.trim();
 const discountText = discountInput.value.trim();

 if(priceText === "" || discountText === ""){
  result.textContent = "Please enter both values.";
  return;
 }

 if(priceText.length > 50 || discountText.length > 50){
  result.textContent = "Please enter shorter numbers.";
  return;
 }

 const price = Number(priceText);
 const discount = Number(discountText);

 if(
  !Number.isFinite(price) ||
  !Number.isFinite(discount) ||
  price < 0 ||
  discount < 0 ||
  discount > 100
 ){
  result.textContent =
   "Enter a valid price and a discount between 0 and 100.";
  return;
 }

 const savings = price * discount / 100;
 const finalPrice = price - savings;

 if(!Number.isFinite(savings) || !Number.isFinite(finalPrice)){
  result.textContent = "The result is too large to calculate.";
  return;
 }

 const finalPriceText = finalPrice.toFixed(2);
 const savingsText = savings.toFixed(2);

 const finalRow = document.createElement("div");
 finalRow.className = "result-row";

 const finalLabel = document.createElement("strong");
 finalLabel.textContent = "Final Price: ";

 const finalValue = document.createElement("span");
 finalValue.textContent = finalPriceText;

 finalRow.append(finalLabel,finalValue);

 const savingsRow = document.createElement("div");
 savingsRow.className = "result-row";

 const savingsLabel = document.createElement("strong");
 savingsLabel.textContent = "You Save: ";

 const savingsValue = document.createElement("span");
 savingsValue.textContent = savingsText;

 savingsRow.append(savingsLabel,savingsValue);

 result.replaceChildren(finalRow,savingsRow);
}

form.addEventListener("submit",calculateDiscount);

</script>

</body>
</html>
