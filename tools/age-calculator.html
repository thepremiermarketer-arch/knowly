
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Calculate your exact age in years, months, and days with Knowly's free age calculator.">
<title>Free Age Calculator | KNOWLY</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#f1f5f9;font-family:Arial,sans-serif}
header{padding:22px 8%;border-bottom:1px solid #263449}
header a,.back{color:#38bdf8;text-decoration:none}
header a{font-size:25px;font-weight:bold}
main{max-width:700px;margin:60px auto;padding:25px}
.card{background:#172337;padding:30px;border-radius:16px;border:1px solid #304158}
h1{font-size:32px}
p{color:#bdc9d8;line-height:1.6}
label{display:block;margin:20px 0 8px}
input{width:100%;padding:14px;border-radius:8px;border:1px solid #52647a;background:#0b1220;color:white;font-size:17px}
button{margin-top:22px;width:100%;padding:15px;background:#0284c7;color:white;border:0;border-radius:8px;font-size:17px;cursor:pointer}
#result{margin-top:22px;padding:18px;background:#0b3045;border-radius:8px;line-height:1.8}
footer{text-align:center;padding:25px;color:#94a3b8}
</style>
</head>
<body>
<header><a href="../index.html">KNOWLY</a></header>
<main>
<a class="back" href="../index.html">← Back to Home</a>
<h1>Free Age Calculator</h1>
<p>Find out your exact age in years, months, and days.</p>
<div class="card">
<label for="birthdate">Enter your date of birth</label>
<input type="date" id="birthdate">
<button onclick="calculateAge()">Calculate My Age</button>
<div id="result" aria-live="polite">Your age will appear here.</div>
</div>
</main>
<footer>© 2026 KNOWLY. Discover More. Do More. Know More.</footer>
<script>
function calculateAge(){
 const input=document.getElementById("birthdate").value;
 const result=document.getElementById("result");
 if(!input){result.textContent="Please enter your date of birth.";return;}
 const [year,month,day]=input.split("-").map(Number);
 const birth=new Date(year,month-1,day);
 const today=new Date();
 today.setHours(0,0,0,0);
 if(birth>today){result.textContent="Date of birth cannot be in the future.";return;}
 let years=today.getFullYear()-year;
 let months=today.getMonth()-(month-1);
 let days=today.getDate()-day;
 if(days<0){
  months--;
  const previousMonthDays=new Date(today.getFullYear(),today.getMonth(),0).getDate();
  days+=previousMonthDays;
 }
 if(months<0){years--;months+=12;}
 result.innerHTML="<strong>Your Age:</strong><br>"+years+" years, "+months+" months, and "+days+" days";
}
</script>
</body>
</html>
