
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Calculate your exact age in years, months, and days with Knowly's free age calculator.">
<meta name="theme-color" content="#0b1220">
<title>Free Age Calculator | KNOWLY</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#0b1220;
 color:#f1f5f9;
 font-family:Arial,sans-serif;
 min-height:100vh;
}

header{
 padding:22px 8%;
 border-bottom:1px solid #263449;
}

header a,.back{
 color:#38bdf8;
 text-decoration:none;
}

header a{
 font-size:25px;
 font-weight:bold;
}

main{
 max-width:700px;
 margin:60px auto;
 padding:25px;
}

.card{
 background:#172337;
 padding:30px;
 border-radius:16px;
 border:1px solid #304158;
}

h1{font-size:32px}

p{
 color:#bdc9d8;
 line-height:1.6;
}

label{
 display:block;
 margin:20px 0 8px;
 font-weight:bold;
}

input{
 width:100%;
 padding:14px;
 border-radius:8px;
 border:1px solid #52647a;
 background:#0b1220;
 color:white;
 font-size:17px;
}

input:focus{
 outline:2px solid #38bdf8;
 outline-offset:2px;
 border-color:#38bdf8;
}

button{
 margin-top:22px;
 width:100%;
 padding:15px;
 background:#0284c7;
 color:white;
 border:0;
 border-radius:8px;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
}

button:hover{background:#0369a1}

button:focus-visible{
 outline:2px solid #38bdf8;
 outline-offset:3px;
}

#result{
 margin-top:22px;
 padding:20px;
 background:#0b3045;
 border-radius:8px;
 line-height:1.8;
 overflow-wrap:anywhere;
}

#result strong{
 display:block;
 color:#38bdf8;
 font-size:20px;
 margin-bottom:8px;
}

footer{
 text-align:center;
 padding:25px;
 color:#94a3b8;
}

@media(max-width:480px){
 main{margin:30px auto;padding:18px}
 .card{padding:20px}
 h1{font-size:27px}
}
</style>
</head>

<body>

<header>
 <a href="../index.html">KNOWLY</a>
</header>

<main>

<a class="back" href="../index.html">← Back to Home</a>

<h1>Free Age Calculator</h1>

<p>Find out your exact age in years, months, and days.</p>

<div class="card">

 <form id="ageForm" novalidate>

  <label for="birthdate">Enter your date of birth</label>

  <input
   type="date"
   id="birthdate"
   required
   aria-label="Enter your date of birth"
  >

  <button type="submit">Calculate My Age</button>

 </form>

 <div id="result" role="status" aria-live="polite" aria-atomic="true">
  Your age will appear here.
 </div>

</div>

</main>

<footer>
 © 2026 KNOWLY. Discover More. Do More. Know More.
</footer>

<script>
"use strict";

const form = document.getElementById("ageForm");
const birthInput = document.getElementById("birthdate");
const result = document.getElementById("result");

// Set today's date as the maximum selectable date.
function getToday(){
 const now = new Date();

 return new Date(
  now.getFullYear(),
  now.getMonth(),
  now.getDate()
 );
}

function formatDate(date){
 const year = date.getFullYear();
 const month = String(date.getMonth()+1).padStart(2,"0");
 const day = String(date.getDate()).padStart(2,"0");

 return `${year}-${month}-${day}`;
}

birthInput.max = formatDate(getToday());

function calculateAge(event){

 event.preventDefault();

 const input = birthInput.value;

 if(!input){
  result.textContent = "Please enter your date of birth.";
  return;
 }

 const parts = input.split("-").map(Number);

 if(parts.length !== 3){
  result.textContent = "Please enter a valid date.";
  return;
 }

 const [year,month,day] = parts;

 // Validate the date components.
 const birth = new Date(0);
 birth.setHours(0,0,0,0);
 birth.setFullYear(year,month-1,day);

 if(
  !Number.isFinite(birth.getTime()) ||
  birth.getFullYear() !== year ||
  birth.getMonth() !== month-1 ||
  birth.getDate() !== day
 ){
  result.textContent = "Please enter a valid date.";
  return;
 }

 const today = getToday();

 if(birth > today){
  result.textContent = "Date of birth cannot be in the future.";
  return;
 }

 let years = today.getFullYear() - year;
 let months = today.getMonth() - (month-1);
 let days = today.getDate() - day;

 // Borrow days from the previous calendar month.
 if(days < 0){
  months--;

  const previousMonthDays = new Date(
   today.getFullYear(),
   today.getMonth(),
   0
  ).getDate();

  days += previousMonthDays;
 }

 // Borrow months from the previous year.
 if(months < 0){
  years--;
  months += 12;
 }

 const yearLabel = years === 1 ? "year" : "years";
 const monthLabel = months === 1 ? "month" : "months";
 const dayLabel = days === 1 ? "day" : "days";

 result.textContent =
  `Your Age: ${years} ${yearLabel}, ${months} ${monthLabel}, and ${days} ${dayLabel}.`;
}

form.addEventListener("submit",calculateAge);

</script>

</body>
</html>
